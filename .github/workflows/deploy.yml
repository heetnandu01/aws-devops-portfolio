name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        id: aws-oidc
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::535709430625:role/GitHubActionsPortfolioDeploy
          aws-region: ap-south-1

      - name: Configure AWS credentials (static fallback)
        if: steps.aws-oidc.outcome == 'failure' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Fail when no AWS auth method is available
        if: steps.aws-oidc.outcome == 'failure' && !(secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '')
        run: |
          echo "OIDC role assumption failed and fallback secrets are not configured."
          echo "Configure repository secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY or fix the IAM OIDC trust policy."
          exit 1

      - name: Upload website to S3
        run: |
          aws s3 sync . s3://heetnandu01-portfolio-site-2026 \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md"
