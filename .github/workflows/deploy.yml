
name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::535709430625:role/GitHubActionsPortfolioDeploy
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload website to S3
        run: |
          aws s3 sync . s3://heetnandu01-portfolio-site-2026 \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md"
